<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mariam</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #000; overflow: hidden; }
    body { font-family: Georgia, serif; }
    canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
    .start {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
      background: rgba(0, 0, 0, .72); cursor: pointer; touch-action: manipulation; transition: opacity .8s ease;
    }
    .start.is-hidden { opacity: 0; pointer-events: none; }
    .start span { color: #fffaf5; font-size: clamp(1rem, 5vw, 1.8rem); letter-spacing: .04em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="heart" aria-label="Een blauw hart met de tekst Mariam"></canvas>
  <div class="start" id="start"><span>عشق حياتي رح ارسملك شغلة حلوة كبسي ع شاشة</span></div>
  <audio id="music" src="love_you.mp3" preload="auto" loop></audio>
  <script>
    const canvas = document.querySelector('#heart');
    const context = canvas.getContext('2d');
    const start = document.querySelector('#start');
    const music = document.querySelector('#music');
    const words = ['love you', 'Love You', 'LOVE YOU'];
    const colors = ['#4682b4', '#1e90ff', '#00bfff', '#6495ed', '#4169e1'];
    const particles = [];
    let width, height, scale, frame = 0, started = false;

    function resize() {
      const ratio = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth; height = innerHeight;
      canvas.width = width * ratio; canvas.height = height * ratio;
      canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      scale = Math.min(width, height) / 52;
    }

    function heart(t) {
      return [16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
    }

    function screen(x, y) { return [x * scale + width / 2, y * scale + height / 2]; }

    function addParticle(x, y, delay, kind) {
      particles.push({ x, y, delay, kind, alpha: 0, flicker: Math.random() * Math.PI * 2,
        word: words[Math.floor(Math.random() * words.length)], color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.max(kind === 'outline' ? 12 : 10, scale * (kind === 'outline' ? .55 : .46)) * (.85 + Math.random() * .3) });
    }

    function buildParticles() {
      particles.length = 0;
      const placed = [];
      for (let i = 0; i < 160; i++) {
        const [x, y] = screen(...heart(i / 160 * Math.PI * 2));
        if (!placed.some(p => Math.hypot(x - p[0], y - p[1]) < 18)) {
          placed.push([x, y]); addParticle(x, y, i * 1.6, 'outline');
        }
      }
      for (let i = 0; i < 130; i++) {
        const t = Math.random() * Math.PI * 2, radius = Math.random() * .86;
        const [x, y] = heart(t); const point = screen(x * radius, y * radius);
        if (!placed.some(p => Math.hypot(point[0] - p[0], point[1] - p[1]) < 28)) {
          placed.push(point); addParticle(point[0], point[1], 290 + Math.random() * 320, 'fill');
        }
      }
    }

    function drawParticle(p) {
      if (frame > p.delay) p.alpha = Math.min(255, p.alpha + 14 + Math.random() * 4);
      if (!p.alpha) return;
      const flicker = p.alpha >= 255 ? .75 + .25 * Math.sin(frame * .04 + p.flicker) : 1;
      const alpha = p.alpha / 255 * flicker;
      context.save(); context.globalAlpha = Math.max(.25, alpha); context.fillStyle = p.color;
      context.shadowColor = p.color; context.shadowBlur = 12;
      context.font = `bold ${p.size}px Arial`; context.textAlign = 'center'; context.textBaseline = 'middle';
      context.fillText(p.word, p.x, p.y); context.restore();
    }

    function animate() {
      if (!started) {
        requestAnimationFrame(animate);
        return;
      }
      frame++; context.clearRect(0, 0, width, height);
      particles.forEach(drawParticle);
      if (frame > 900) {
        const alpha = Math.min(1, (frame - 900) / 60);
        const pulse = 1 + .025 * Math.sin(frame * .05);
        context.save(); context.globalAlpha = alpha; context.fillStyle = '#fffaf5';
        context.shadowColor = '#fffaf5'; context.shadowBlur = 18;
        const centerLines = width <= 600 ? ['Mariam', 'I love you so much'] : ['Mariam I love you so much'];
        let centerSize = width <= 600 ? 22 : Math.min(54, Math.max(18, width * .12));
        context.font = `bold ${centerSize}px Georgia`;
        const maxTextWidth = Math.max(180, width - 40);
        const measuredWidth = Math.max(...centerLines.map(line => context.measureText(line).width));
        if (measuredWidth > maxTextWidth) centerSize *= maxTextWidth / measuredWidth;
        context.font = `bold ${centerSize * pulse}px Georgia`;
        context.textAlign = 'center'; context.textBaseline = 'middle';
        const lineHeight = centerSize * pulse * 1.15;
        centerLines.forEach((line, index) => context.fillText(line, width / 2, height / 2 + (index - (centerLines.length - 1) / 2) * lineHeight));
        context.restore();
      }
      requestAnimationFrame(animate);
    }

    start.addEventListener('click', () => {
      if (started) return; started = true; start.classList.add('is-hidden');
      music.play().catch(() => {});
    });
    addEventListener('resize', () => { resize(); buildParticles(); });
    resize(); buildParticles(); animate();
  </script>
</body>
</html>
